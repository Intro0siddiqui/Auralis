name: Debug Android Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  build-android-debug-arm64:
    name: Build Android Debug (arm64 only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "false"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Register NDK paths
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}

      - name: Init Android project
        run: |
          if [ ! -f gen/android/app/build.gradle.kts ]; then
            npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android init
          else
            echo "gen/android already present — skipping init"
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Inject Android Audio & Storage Permissions and MediaPlaybackService
        run: |
          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting storage and media permissions into AndroidManifest.xml"
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST"
            sed -i 's|android:usesCleartextTraffic="\${usesCleartextTraffic}"|android:usesCleartextTraffic="true"|' "$MANIFEST"
            sed -i '/<\/application>/i \        <service android:name=".MediaPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>' "$MANIFEST"
          fi
          PKG_DIR="gen/android/app/src/main/java/com/auralis/v2"
          mkdir -p "$PKG_DIR"
          cp scripts/android/MediaPlaybackService.kt "$PKG_DIR/MediaPlaybackService.kt"
          cp scripts/android/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          cp scripts/android/MediaStoreScanner.kt "$PKG_DIR/MediaStoreScanner.kt"
          echo "Installed MediaPlaybackService.kt, MainActivity.kt, and MediaStoreScanner.kt"

      - name: Configure Android SDK versions
        run: |
          for f in $(find gen/android -name "build.gradle*" 2>/dev/null); do
            if [ -f "$f" ]; then
              echo "Setting compileSdk and targetSdk to 36 and minSdk to 26 in $f"
              sed -i -E 's/(compileSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(targetSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(minSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\126/g' "$f"
            fi
          done

      - name: Bundle C++ runtime (libc++_shared.so, arm64-v8a only)
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          src="$NDK_SYSROOT/aarch64-linux-android/libc++_shared.so"
          if [ ! -f "$src" ]; then
            echo "WARN: libc++_shared.so not found at $src"
          else
            dest="gen/android/app/src/main/jniLibs/arm64-v8a"
            mkdir -p "$dest"
            cp "$src" "$dest/"
            echo "Bundled libc++_shared.so -> $dest"
          fi

      - name: Build Debug APK (arm64 only)
        run: |
          SYSROOT_LIB="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-L $SYSROOT_LIB"
          npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android build --apk --target aarch64 --debug
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate Debug APK
        run: |
          APK=$(find gen/android -name "*.apk" -path "*debug*" | head -1)
          if [ -z "$APK" ]; then
            echo "No debug APK found!"
            find gen/android -name "*.apk" || true
            exit 1
          fi
          echo "Found debug APK: $APK"
          cp "$APK" auralis-debug-arm64.apk
          ls -lh auralis-debug-arm64.apk

      # Re-sign with a keystore committed to the repo. Left to Gradle, each run
      # signs with the runner's fresh `~/.android/debug.keystore`, so every build
      # produced a *different* certificate — and Android refuses to install a
      # differently-signed APK over the existing one. Each device test therefore
      # forced an uninstall that wiped the owner's library and downloads.
      # Measured: installed cert == run 37193906620's cert (parser control),
      # != run 37363969233's cert. Same zipalign+apksigner pattern build.yml
      # already uses for releases.
      - name: Re-sign with the pinned debug keystore
        run: |
          ZALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ -z "$ZALIGN" ]; then
            echo "apksigner or zipalign not found under $ANDROID_HOME/build-tools"
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type d || true
            exit 1
          fi

          "$ZALIGN" -f -P 16 4 auralis-debug-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks ci/debug-android.p12 \
            --ks-key-alias auralis \
            --ks-pass pass:password \
            --key-pass pass:password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out auralis-debug-arm64.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose auralis-debug-arm64.apk

          # Fail loudly if the pinned key did not land. A wrong certificate is
          # invisible until the owner's phone refuses the install, at which
          # point the "fix" is another wipe — so assert it here instead.
          # EXPECT is the sha256 of ci/debug-android.p12's certificate; if that
          # keystore is ever rotated, recompute and update it in the same PR.
          EXPECT="AE113990B48928086406656D2E23BB2048E947BBCFB185E3EE460B8D4A2B860E"
          ACTUAL=$("$APKSIGNER" verify --print-certs auralis-debug-arm64.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F')
          echo "expected=$EXPECT actual=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::debug APK is not signed with the pinned keystore (ci/debug-android.p12)"
            exit 1
          fi
          echo "Pinned key confirmed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-android-arm64
          path: auralis-debug-arm64.apk
          retention-days: 14
