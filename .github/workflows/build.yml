name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            xvfb \
            pkg-config

      - name: Build binary
        run: cargo build --release

      - name: Run unit & integration tests
        run: cargo test --all-features

      - name: Run JS unit tests (YouTube resolver - catches ARM stream regression)
        run: node --test scripts/tests/youtube_resolver.test.js

      - name: Install Tauri Driver (for real-binary IPC E2E)
        run: cargo install tauri-driver --locked || echo "tauri-driver install failed, fallback to smoke check"

      - name: Run Real-Binary Desktop E2E (Tauri IPC)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scripts/tests/desktop_real_e2e.js

      - name: Run Desktop Download → Player E2E (JS, Rust downloader + player)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scripts/tests/desktop_download_player_e2e.js
        env:
          E2E_STRICT: "1"

      - name: Package
        # Release artifact bundling is only meaningful on tag pushes. On
        # pull_request runs github.ref_name is "<PR>/merge" (contains a slash),
        # which breaks these path-based artifact names — so skip packaging/upload
        # and let PRs just validate compilation.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/release
          tar czf auralis-${{ github.ref_name }}-linux-x64.tar.gz auralis

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: target/release/auralis-*.tar.gz

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}
        shell: bash

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.app / .dmg)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: target/release/bundle/dmg/*.dmg

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}
        shell: bash

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.msi / .exe installer)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  build-android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Only persist caches from main/tags — PR runs reuse but never churn them
          save-if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Register NDK paths
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          save-always: true
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install Tauri CLI
        # npm ships a prebuilt binary — cargo install would compile for ~2 min
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}

      - name: Init Android project
        run: |
          if [ ! -f gen/android/app/build.gradle.kts ]; then
            npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android init
          else
            echo "gen/android already present — skipping init"
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Apply Custom Auralis App Icons
        run: |
          RES_DIR="gen/android/app/src/main/res"
          if [ -d "icons/android" ] && [ -d "$RES_DIR" ]; then
            echo "Copying custom Auralis mipmap icons to $RES_DIR"
            cp -r icons/android/* "$RES_DIR/"
            echo "Custom launcher icons applied successfully!"
          fi

      - name: Inject Android Audio & Storage Permissions and MediaPlaybackService
        run: |
          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting storage and media permissions into AndroidManifest.xml"
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST"
            sed -i 's|android:usesCleartextTraffic="\${usesCleartextTraffic}"|android:usesCleartextTraffic="true"|' "$MANIFEST"
            sed -i '/<\/application>/i \        <service android:name=".MediaPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>' "$MANIFEST"
            echo "Updated AndroidManifest.xml:"
            cat "$MANIFEST"
          fi

          # Install MediaPlaybackService and MainActivity Kotlin implementations from repo
          PKG_DIR="gen/android/app/src/main/java/com/auralis/v2"
          mkdir -p "$PKG_DIR"
          cp scripts/android/MediaPlaybackService.kt "$PKG_DIR/MediaPlaybackService.kt"
          cp scripts/android/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          echo "Installed MediaPlaybackService.kt and MainActivity.kt from repo into $PKG_DIR"

      - name: Configure Android SDK versions
        run: |
          for f in $(find gen/android -name "build.gradle*" 2>/dev/null); do
            if [ -f "$f" ]; then
              echo "Setting compileSdk and targetSdk to 36 and minSdk to 26 in $f"
              sed -i -E 's/(compileSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(targetSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(minSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\126/g' "$f"
              echo "Updated $f:"
              cat "$f"
            fi
          done

      - name: Bundle C++ runtime (libc++_shared.so)
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for spec in "aarch64-linux-android:arm64-v8a" "x86_64-linux-android:x86_64"; do
            lib="${spec%%:*}"
            abi="${spec##*:}"
            src="$NDK_SYSROOT/$lib/libc++_shared.so"
            if [ ! -f "$src" ]; then
              echo "WARN: libc++_shared.so not found for $lib at $src"
              continue
            fi
            dest="gen/android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "$src" "$dest/"
            echo "Bundled libc++_shared.so -> $dest"
          done

      - name: Verify 16 KB ELF Page Alignment
        run: |
          echo "Verifying 16 KB ELF segment alignment of bundled native libraries..."
          for so in $(find gen/android -name "*.so" 2>/dev/null); do
            echo "Inspecting ELF headers for $so:"
            readelf -lW "$so" | grep -A 1 -E "LOAD|GNU_RELRO" || true
          done

      - name: Generate keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/auralis-release.jks \
            -alias auralis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Auralis, OU=Auralis, O=Auralis, L=Unknown, ST=Unknown, C=US"

      - name: Tune Gradle performance
        run: |
          GP="gen/android/gradle.properties"
          touch "$GP"
          grep -q "org.gradle.caching" "$GP" || printf "\norg.gradle.caching=true\norg.gradle.parallel=true\n" >> "$GP"
          echo "Gradle performance flags enabled"

      - name: Build APK
        run: |
          SYSROOT_LIB_ARM64="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          SYSROOT_LIB_X64="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/26"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-L $SYSROOT_LIB_ARM64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-L $SYSROOT_LIB_X64"
          npx @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android build --apk --target aarch64 x86_64 --split-per-abi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ZALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ -z "$ZALIGN" ]; then
            echo "apksigner or zipalign not found!"
            exit 1
          fi

          echo "Signing all per-ABI APKs (arm64 + x86_64)"
          COUNT=0
          for APK_PATH in $(find gen/android -name "*.apk" -path "*/release/*"); do
            [ -z "$APK_PATH" ] && continue
            echo "Found APK: $APK_PATH"
            # Derive ABI label from path/filename
            if echo "$APK_PATH" | grep -qi "arm64\|aarch64"; then
              ABI="arm64"
            elif echo "$APK_PATH" | grep -qi "x86_64\|x64"; then
              ABI="x86_64"
            else
              # Universal or unknown — infer from contents
              if unzip -l "$APK_PATH" 2>/dev/null | grep -q "lib/arm64-v8a"; then ABI="arm64"; else ABI="x86_64"; fi
            fi
            OUT="auralis-${{ github.ref_name }}-android-${ABI}.apk"
            echo " -> Signing $APK_PATH as $OUT ($ABI)"
            "$ZALIGN" -f -P 16 4 "$APK_PATH" "$RUNNER_TEMP/aligned-${ABI}.apk"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/auralis-release.jks" \
              --ks-key-alias auralis \
              --ks-pass pass:password \
              --key-pass pass:password \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUT" \
              "$RUNNER_TEMP/aligned-${ABI}.apk"
            "$APKSIGNER" verify --verbose "$OUT"
            COUNT=$((COUNT+1))
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "No APK found to sign!"
            exit 1
          fi
          echo "Signed $COUNT APK(s):"
          ls -lh auralis-*-android-*.apk

      - name: Verify Android APK Native Binary & Scanner Assets
        run: |
          APK_LIST=$(find . -maxdepth 1 -name "auralis-*-android-*.apk")
          if [ -z "$APK_LIST" ]; then
            APK_LIST=$(find gen/android -name "*.apk" -path "*/release/*")
          fi
          if [ -z "$APK_LIST" ]; then
            echo "No APKs found for verification!"
            exit 1
          fi

          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ZALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)

          for APK_TARGET in $APK_LIST; do
            echo "===== Inspecting APK: $APK_TARGET ====="
            unzip -l "$APK_TARGET" | grep -E "libauralis_lib\.so|libauralis\.so" || { echo "libauralis native library missing in $APK_TARGET!"; exit 1; }
            unzip -l "$APK_TARGET" | grep "libc++_shared.so" || { echo "libc++_shared.so missing in $APK_TARGET!"; exit 1; }
            unzip -l "$APK_TARGET" | grep -E "AndroidManifest\.xml" || { echo "AndroidManifest.xml missing in $APK_TARGET!"; exit 1; }
            echo "Checking 16KB zipalign for $APK_TARGET..."
            if ! "$ZALIGN" -c -P 16 4 "$APK_TARGET" > /dev/null 2>&1; then
              echo "zipalign verification details for $APK_TARGET:"
              "$ZALIGN" -c -v -P 16 4 "$APK_TARGET" || exit 1
            fi
            # Determine ABI lib dir inside APK
            if unzip -l "$APK_TARGET" | grep -q "lib/arm64-v8a/"; then
              LIB_DIR="lib/arm64-v8a"
            elif unzip -l "$APK_TARGET" | grep -q "lib/x86_64/"; then
              LIB_DIR="lib/x86_64"
            else
              echo "No recognized lib dir in $APK_TARGET (listing):"
              unzip -l "$APK_TARGET" | grep "lib/" | head
              continue
            fi
            TMP_DIR=$(mktemp -d)
            unzip -q "$APK_TARGET" "${LIB_DIR}/*.so" -d "$TMP_DIR" || true
            if [ ! -x "$READELF" ]; then
              echo "llvm-readelf not found at $READELF"
              exit 1
            fi
            for so in "$TMP_DIR"/${LIB_DIR}/*.so; do
              [ -f "$so" ] || continue
              BAD=$("$READELF" -lW "$so" | awk '$1=="LOAD" && $NF != "0x4000" {print $NF}')
              if [ -n "$BAD" ]; then
                echo "FAIL: $(basename "$so") in $APK_TARGET has non-16KB LOAD alignments: $BAD"
                exit 1
              fi
              echo "OK: $(basename "$so") in $APK_TARGET all LOAD segments 16KB-aligned"
            done
            rm -rf "$TMP_DIR"
          done
          echo "All Android APKs verified successfully (native lib, 16KB alignment, scanner assets)!"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: auralis-*-android-*.apk

  test-android-e2e:
    name: Android E2E Download & Playback Test (x86_64 KVM)
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache-e2e
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018

      - name: Install NDK
        if: steps.ndk-cache-e2e.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Register NDK paths
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          save-always: true
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Install dependencies & Tauri CLI
        run: |
          npm install
          npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}

      - name: Init Android project
        run: npx --yes @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android init || true
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Apply Custom Auralis App Icons
        run: |
          RES_DIR="gen/android/app/src/main/res"
          if [ -d "icons/android" ] && [ -d "$RES_DIR" ]; then
            echo "Copying custom Auralis mipmap icons to $RES_DIR"
            cp -r icons/android/* "$RES_DIR/"
            echo "Custom launcher icons applied successfully!"
          fi

      - name: Inject Android Audio & Storage Permissions and MediaPlaybackService
        run: |
          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting storage and media permissions into AndroidManifest.xml"
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST"
            sed -i 's|android:usesCleartextTraffic="\${usesCleartextTraffic}"|android:usesCleartextTraffic="true"|' "$MANIFEST"
            sed -i '/<\/application>/i \        <service android:name=".MediaPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>' "$MANIFEST"
            echo "Updated AndroidManifest.xml:"
            cat "$MANIFEST"
          fi

          PKG_DIR="gen/android/app/src/main/java/com/auralis/v2"
          mkdir -p "$PKG_DIR"
          cp scripts/android/MediaPlaybackService.kt "$PKG_DIR/MediaPlaybackService.kt"
          cp scripts/android/MainActivity.kt "$PKG_DIR/MainActivity.kt"
          echo "Installed MediaPlaybackService.kt and MainActivity.kt from repo into $PKG_DIR"

      - name: Configure Android SDK versions
        run: |
          for f in $(find gen/android -name "build.gradle*" 2>/dev/null); do
            if [ -f "$f" ]; then
              echo "Setting compileSdk and targetSdk to 36 and minSdk to 26 in $f"
              sed -i -E 's/(compileSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(targetSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(minSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\126/g' "$f"
              echo "Updated $f:"
              cat "$f"
            fi
          done

      - name: Bundle C++ runtime (libc++_shared.so)
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for spec in "x86_64-linux-android:x86_64"; do
            lib="${spec%%:*}"
            abi="${spec##*:}"
            src="$NDK_SYSROOT/$lib/libc++_shared.so"
            if [ ! -f "$src" ]; then
              echo "WARN: libc++_shared.so not found for $lib at $src"
              continue
            fi
            dest="gen/android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "$src" "$dest/"
            echo "Bundled libc++_shared.so -> $dest"
          done

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/auralis-test.jks \
            -alias auralis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Auralis, OU=Auralis, O=Auralis, L=Unknown, ST=Unknown, C=US"

      - name: Build APK (x86_64 CI Test Target)
        run: |
          SYSROOT_LIB_X64="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/26"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-L $SYSROOT_LIB_X64"
          npx --yes @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} android build --apk --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign Test APK
        id: sign
        run: |
          RAW_APK=$(find gen/android -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find gen/android -name "*.apk" | head -1)
          fi
          echo "Found raw APK: $RAW_APK"
          ZALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          "$ZALIGN" -f -P 16 4 "$RAW_APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/auralis-test.jks" \
            --ks-key-alias auralis \
            --ks-pass pass:password \
            --key-pass pass:password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/auralis-test-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/auralis-test-signed.apk"
          echo "Signed APK created at: $RUNNER_TEMP/auralis-test-signed.apk"
          echo "apk_path=$RUNNER_TEMP/auralis-test-signed.apk" >> $GITHUB_OUTPUT

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run E2E YouTube Download & Playback Test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/run_emulator_test.sh "${{ steps.sign.outputs.apk_path }}"

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: "false"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Audit
        run: cargo audit || echo "::warning::audit failed"

  live-youtube-e2e:
    name: Live YouTube E2E (player API)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run JS unit tests (YouTube resolver)
        run: node --test scripts/tests/youtube_resolver.test.js

      - name: Live YouTube player API check (7C4-TAWg7QA, Sx8z0U0lkjQ)
        run: |
          node <<'NODE'
          const https = require('https');
          const ids = ['7C4-TAWg7QA', 'Sx8z0U0lkjQ'];
          const key = 'AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8';
          function post(videoId) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                videoId,
                context: { client: { clientName: 'ANDROID', clientVersion: '20.10.38' } }
              });
              const req = https.request({
                method: 'POST',
                hostname: 'www.youtube.com',
                path: `/youtubei/v1/player?key=${key}`,
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, (res) => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, json: JSON.parse(data) }); }
                  catch (e) { reject(new Error(`JSON parse failed: ${e.message} body=${data.slice(0,500)}`)); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }
          (async () => {
            for (const id of ids) {
              console.log(`Checking ${id}...`);
              let retries = 2;
              let result;
              while (true) {
                try { result = await post(id); break; } catch (e) { if (retries-- <= 0) throw e; console.warn(`retry ${id}: ${e.message}`); await new Promise(r => setTimeout(r, 2000)); }
              }
              const st = result.json?.playabilityStatus?.status;
              console.log(`  ${id} -> playabilityStatus: ${st} (http ${result.status})`);
              if (st !== 'OK') {
                console.error(`  Expected OK for ${id}, got ${st}`);
                console.error(JSON.stringify(result.json?.playabilityStatus, null, 2));
                process.exit(1);
              }
              const sd = result.json?.streamingData;
              const fmtCount = (sd?.adaptiveFormats?.length || 0) + (sd?.formats?.length || 0);
              console.log(`  formats: ${fmtCount}`);
            }
            console.log('All live checks OK');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

  ci:
    name: CI status
    if: always()
    needs: [lint, build-linux, build-android, test-android-e2e]
    runs-on: ubuntu-22.04
    steps:
      - name: Check required jobs
        run: |
          results='${{ toJson(needs) }}'
          echo "$results" | jq .
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' || { echo "::error::One or more required jobs failed"; exit 1; }
          echo "All required checks passed"

  release:
    needs: [build-linux, build-macos, build-windows, build-android, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.apk
            release-assets/**/*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
