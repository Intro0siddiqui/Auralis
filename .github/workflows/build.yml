name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: End-to-end test (audio scan & ingestion)
        run: cargo test --test integration -- --nocapture

      - name: Build binary
        run: cargo build --release

      - name: Package
        # Release artifact bundling is only meaningful on tag pushes. On
        # pull_request runs github.ref_name is "<PR>/merge" (contains a slash),
        # which breaks these path-based artifact names — so skip packaging/upload
        # and let PRs just validate compilation.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/release
          tar czf auralis-${{ github.ref_name }}-linux-x64.tar.gz auralis

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: target/release/auralis-*.tar.gz

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0
        shell: bash

      - name: End-to-end test (audio scan & ingestion)
        run: cargo test --test integration -- --nocapture

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.app / .dmg)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx @tauri-apps/cli build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: target/release/bundle/dmg/*.dmg

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0
        shell: bash

      - name: End-to-end test (audio scan & ingestion)
        run: cargo test --test integration -- --nocapture

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.msi / .exe installer)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx @tauri-apps/cli build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  build-android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.4" 2>/dev/null || npm install -g @tauri-apps/cli@2.11.4

      - name: Init Android project
        run: cargo tauri android init || npx @tauri-apps/cli android init || true
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Apply Custom Auralis App Icons
        run: |
          RES_DIR="gen/android/app/src/main/res"
          if [ -d "icons/android" ] && [ -d "$RES_DIR" ]; then
            echo "Copying custom Auralis mipmap icons to $RES_DIR"
            cp -r icons/android/* "$RES_DIR/"
            echo "Custom launcher icons applied successfully!"
          fi

      - name: Inject Android Audio & Storage Permissions and MediaPlaybackService
        run: |
          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting storage and media permissions into AndroidManifest.xml"
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            sed -i '/<manifest[^>]*>/a \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
            sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST"
            sed -i '/<\/application>/i \        <service android:name=".MediaPlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>' "$MANIFEST"
            echo "Updated AndroidManifest.xml:"
            cat "$MANIFEST"
          fi

          # Install MediaPlaybackService Kotlin implementation from the repo
          PKG_DIR="gen/android/app/src/main/java/com/auralis/v2"
          mkdir -p "$PKG_DIR"
          cp scripts/android/MediaPlaybackService.kt "$PKG_DIR/MediaPlaybackService.kt"
          echo "Installed MediaPlaybackService.kt from repo into $PKG_DIR"

      - name: Configure Android SDK versions
        run: |
          for f in $(find gen/android -name "build.gradle*" 2>/dev/null); do
            if [ -f "$f" ]; then
              echo "Setting compileSdk and targetSdk to 36 in $f"
              sed -i -E 's/(compileSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              sed -i -E 's/(targetSdk(Version)?(\.set\(|\s*=?\s*|\s*\(\s*))[0-9]+/\136/g' "$f"
              echo "Updated $f:"
              cat "$f"
            fi
          done

      - name: Bundle C++ runtime (libc++_shared.so)
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for spec in "aarch64-linux-android:arm64-v8a"; do
            lib="${spec%%:*}"
            abi="${spec##*:}"
            src="$NDK_SYSROOT/$lib/libc++_shared.so"
            if [ ! -f "$src" ]; then
              echo "WARN: libc++_shared.so not found for $lib at $src"
              continue
            fi
            dest="gen/android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "$src" "$dest/"
            echo "Bundled libc++_shared.so -> $dest"
          done

      - name: Verify 16 KB ELF Page Alignment
        run: |
          echo "Verifying 16 KB ELF segment alignment of bundled native libraries..."
          for so in $(find gen/android -name "*.so" 2>/dev/null); do
            echo "Inspecting ELF headers for $so:"
            readelf -lW "$so" | grep -A 1 -E "LOAD|GNU_RELRO" || true
          done

      - name: Generate keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/auralis-release.jks \
            -alias auralis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Auralis, OU=Auralis, O=Auralis, L=Unknown, ST=Unknown, C=US"

      - name: Build APK
        run: cargo tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_PATH=$(find gen/android -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          ZALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ -z "$ZALIGN" ]; then
            echo "apksigner or zipalign not found!"
            exit 1
          fi

          echo "Running 16 KB zipalign on $APK_PATH"
          "$ZALIGN" -f -P 16 4 "$APK_PATH" "$RUNNER_TEMP/aligned.apk"

          echo "Signing aligned APK with apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/auralis-release.jks" \
            --ks-key-alias auralis \
            --ks-pass pass:password \
            --key-pass pass:password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "auralis-${{ github.ref_name }}-android.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "auralis-${{ github.ref_name }}-android.apk"

      - name: Verify Android APK Native Binary & Scanner Assets
        run: |
          APK_TARGET=$(find . -maxdepth 1 -name "auralis-*-android.apk" | head -1)
          if [ -z "$APK_TARGET" ]; then
            APK_TARGET=$(find gen/android -name "*.apk" -path "*/release/*" | head -1)
          fi
          echo "Inspecting compiled Android APK: $APK_TARGET"
          unzip -l "$APK_TARGET" | grep -E "libauralis_lib\.so|libauralis\.so" || { echo "libauralis native library missing in APK!"; exit 1; }
          unzip -l "$APK_TARGET" | grep "libc++_shared.so" || { echo "libc++_shared.so missing in APK!"; exit 1; }
          unzip -l "$APK_TARGET" | grep -E "AndroidManifest\.xml" || { echo "AndroidManifest.xml missing in APK!"; exit 1; }
          echo "Checking 16KB page-size alignment (required for Android 15+ / Play 2026)..."
          ZALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -1)
          if [ -z "$ZALIGN" ]; then
            echo "zipalign not found!"
            exit 1
          fi
          if ! "$ZALIGN" -c -P 16 4 "$APK_TARGET" > /dev/null 2>&1; then
            echo "Checking zipalign verification details:"
            "$ZALIGN" -c -v -P 16 4 "$APK_TARGET" || exit 1
          fi
          TMP_DIR=$(mktemp -d)
          unzip -q "$APK_TARGET" "lib/arm64-v8a/*.so" -d "$TMP_DIR"
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "$READELF" ]; then
            echo "llvm-readelf not found at $READELF"
            exit 1
          fi
          for so in "$TMP_DIR"/lib/arm64-v8a/*.so; do
            BAD=$("$READELF" -lW "$so" | awk '$1=="LOAD" && $NF != "0x4000" {print $NF}')
            if [ -n "$BAD" ]; then
              echo "FAIL: $(basename "$so") has non-16KB LOAD alignments: $BAD"
              exit 1
            fi
            echo "OK: $(basename "$so") all LOAD segments 16KB-aligned"
          done
          rm -rf "$TMP_DIR"
          echo "Android APK structure, native audio engine, 16KB alignment, and scanner assets verified successfully!"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: auralis-*-android.apk

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Run end-to-end tests (audio scan, ingestion & library)
        run: cargo test --all-features

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  release:
    needs: [build-linux, build-macos, build-windows, build-android, test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.apk
            release-assets/**/*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
