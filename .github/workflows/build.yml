name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Build
        run: cargo build --release

      - name: Package
        # Release artifact bundling is only meaningful on tag pushes. On
        # pull_request runs github.ref_name is "<PR>/merge" (contains a slash),
        # which breaks these path-based artifact names — so skip packaging/upload
        # and let PRs just validate compilation.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/release
          tar czf auralis-${{ github.ref_name }}-linux-x64.tar.gz auralis

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: target/release/auralis-*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        # `cargo tauri build` produces a real .app/.dmg instead of a bare binary.
        run: cargo install tauri-cli --version "^2.0.0" 2>/dev/null || npm install -g @tauri-apps/cli
        # `2>/dev/null` is Unix syntax; the Windows runner's default pwsh shell
        # misparses it as a path (D:\dev\null). Run with bash so it works on
        # both platforms.
        shell: bash

      - name: Install bundled sidecars (yt-dlp, ffmpeg)
        # `tauri.conf.json` declares these as `externalBin`; Tauri resolves them
        # next to the executable on every platform. They must be present at
        # build time or `tauri build` fails.
        run: |
          mkdir -p src-tauri/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/bin/yt-dlp
          chmod +x src-tauri/bin/yt-dlp
          brew install ffmpeg
          cp "$(which ffmpeg)" src-tauri/bin/ffmpeg
          chmod +x src-tauri/bin/ffmpeg

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.app / .dmg)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo tauri build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: src-tauri/target/release/bundle

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        # `2>/dev/null` is Unix syntax; the Windows runner's default pwsh shell
        # misparses it as a path (D:\dev\null). Run with bash so it works on
        # both platforms.
        run: cargo install tauri-cli --version "^2.0.0" 2>/dev/null || npm install -g @tauri-apps/cli
        shell: bash

      - name: Install bundled sidecars (yt-dlp, ffmpeg)
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/bin/yt-dlp.exe
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          unzip -o ffmpeg.zip
          cp ffmpeg-*-essentials/bin/ffmpeg.exe src-tauri/bin/ffmpeg.exe

      - name: Build (compile gate)
        run: cargo build --release

      - name: Bundle (.msi / .exe installer)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo tauri build

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: src-tauri/target/release/bundle

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.5.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('gen/android/**/*.gradle*', 'gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" 2>/dev/null || npm install -g @tauri-apps/cli

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Init Android project
        run: cargo tauri android init || true
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Bundle C++ runtime (libc++_shared.so)
        run: |
          NDK_SYSROOT="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          for spec in "aarch64-linux-android:arm64-v8a" "arm-linux-androideabi:armeabi-v7a" "i686-linux-android:x86" "x86_64-linux-android:x86_64"; do
            lib="${spec%%:*}"
            abi="${spec##*:}"
            src="$NDK_SYSROOT/$lib/libc++_shared.so"
            if [ ! -f "$src" ]; then
              echo "WARN: libc++_shared.so not found for $lib at $src"
              continue
            fi
            dest="gen/android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp "$src" "$dest/"
            echo "Bundled libc++_shared.so -> $dest"
          done

      - name: Generate keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/auralis-release.jks \
            -alias auralis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Auralis, OU=Auralis, O=Auralis, L=Unknown, ST=Unknown, C=US"

      - name: Build APK
        run: cargo tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_PATH=$(find gen/android -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found!"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/auralis-release.jks" \
            --ks-key-alias auralis \
            --ks-pass pass:password \
            --key-pass pass:password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "auralis-${{ github.ref_name }}-android.apk" \
            "$APK_PATH"
          "$APKSIGNER" verify --verbose "auralis-${{ github.ref_name }}-android.apk"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: auralis-*-android.apk

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Run tests
        run: cargo test --all-features

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  release:
    needs: [build-linux, build-macos, build-windows, build-android, test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*/*
          generate_release_notes: true
          fail_on_unmatched_files: false
