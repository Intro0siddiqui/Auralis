[package]
name = "auralis"
version = "2.1.29"
edition = "2021"
authors = ["Auralis Team"]
description = "A lightweight, offline-first music player with integrated media downloading and P2P synchronization"
license = "MIT"
repository = "https://github.com/Intro0siddiqui/Auralis"
rust-version = "1.75"
readme = "README.md"
default-run = "auralis"

# Force the tauri build to know where to find tauri.conf.json
[package.metadata.tauri]
build = { }

[lib]
name = "auralis_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "auralis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core async runtime
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP streaming client (pure-Rust; fetches resolved audio streams from the
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Tauri runtime (v2)
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
dirs = "5"
hostname = "0.4"
rand = "0.8"

# P2P networking (light use — main runtime would be libp2p over IPC)
# `macros` enables the NetworkBehaviour derive; `json` enables the serde_json
# request-response codec for sync payload transfer.
libp2p = { version = "0.54", features = ["tcp", "mdns", "noise", "yamux", "gossipsub", "request-response", "tokio", "macros", "json"] }

# QR code generation
qrcode = "0.14"
# Image decoding for metadata/artwork & icons
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
base64 = "0.22"

# Audio playback
# rodio 0.22 uses high-level format features that handle both the codec 
# and the container parser (e.g., isomp4 for m4a).
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }
# Audio metadata
lofty = "0.21"

# Filesystem globbing
glob = "0.3"

# Android: initialize the ndk-context global used by cpal/oboe's audio
# backend. Tauri v2 does not set it up, so we export JNI_OnLoad ourselves.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }
ndk-context = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
overflow-checks = false
debug = false

[profile.dev]
incremental = true
