<section class="page-library">
    <header class="section-header">
        <h2 class="section-title">Library</h2>
        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
            <button class="btn btn-primary neu" onclick="window.Auralis.bridge.triggerFolderScan()">
                <i data-lucide="folder-search"></i>
                Scan Device / Folder
            </button>
            <button class="btn btn-secondary neu" onclick="document.getElementById('audio-import-input').click()">
                <i data-lucide="file-plus-2"></i>
                Import Audio
            </button>
            <input type="file" id="audio-import-input" multiple accept="audio/*,.mp3,.flac,.wav,.m4a,.aac,.ogg" style="display: none;" onchange="window.Auralis.bridge.handleAudioImport(this)">
            <input type="file" id="folder-scan-input" webkitdirectory directory multiple style="display: none;" onchange="window.Auralis.bridge.handleFolderScan(this)">
        </div>
    </header>

    <div class="filter-bar">
        <select name="sort_by" class="input">
            <option value="date_added">Date added</option>
            <option value="title">Title</option>
            <option value="artist">Artist</option>
            <option value="album">Album</option>
        </select>
        <label class="checkbox">
            <input type="checkbox" name="downloaded_only" />
            Downloaded only
        </label>
    </div>

    <div class="track-list">
        <!-- Dynamically populated by bridge.js loadLibraryView() -->
    </div>
</section>
