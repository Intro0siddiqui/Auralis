<div class="page-home">
    <div class="section-header" style="margin-top: 0;">
        <h2 class="section-title">Welcome</h2>
    </div>

    <section class="quick-actions" style="display: flex; gap: var(--space-3); margin-bottom: var(--space-6); flex-wrap: wrap;">
        <button class="btn btn-primary neu" onclick="window.Auralis.bridge.triggerAudioImport()">
            <i data-lucide="file-plus-2"></i>
            Import Audio
        </button>
        <button class="btn btn-secondary neu" onclick="window.Auralis.bridge.triggerFolderScan()">
            <i data-lucide="folder-search"></i>
            Scan Storage
        </button>
        <button class="btn btn-secondary neu" hx-get="/partials/download.html" hx-target="#content" hx-swap="innerHTML transition:true">
            <i data-lucide="download"></i>
            Download Audio
        </button>
    </section>

    <div id="home-dynamic-content">
        <section class="section-header">
            <h2 class="section-title">Recently Added</h2>
            <a href="#" class="section-link" hx-get="/partials/library.html" hx-target="#content" hx-swap="innerHTML transition:true">See all</a>
        </section>

        <div class="shelf" id="recently-added-shelf">
            <!-- Dynamic recently added cards -->
        </div>

        <section class="section-header" style="margin-top: var(--space-6);">
            <h2 class="section-title">Continue Listening</h2>
        </section>

        <div class="track-list" id="continue-listening-tracks">
            <!-- Dynamic continue listening track rows -->
        </div>
    </div>
</div>
