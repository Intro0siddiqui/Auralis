<section class="page-downloads">
    <header class="section-header">
        <h2 class="section-title">Download Audio</h2>
    </header>

    <!-- YouTube Search & Download -->
    <div class="card neu-glass" style="padding: var(--space-4); margin-bottom: var(--space-4); border-radius: var(--radius-lg);">
        <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3);">
            <i data-lucide="youtube" style="color: var(--accent); width: 22px; height: 22px;"></i>
            <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); margin: 0; color: var(--text-1);">Search & Download</h3>
        </div>
        <form id="youtube-search-form" onsubmit="return false" style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
            <input type="text" name="q" class="input" placeholder="Search YouTube songs, artists, albums…"
                   style="flex: 1; min-width: 200px;" autocomplete="off">
            <button type="submit" class="btn btn-primary neu" id="youtube-search-btn">
                <i data-lucide="search"></i>
                Search
            </button>
        </form>
        <div id="youtube-search-spinner" style="display: none; text-align: center; padding: var(--space-6) var(--space-4);">
            <i data-lucide="loader-2" class="spin" style="width: 28px; height: 28px; color: var(--accent);"></i>
            <p style="margin-top: var(--space-2); color: var(--text-3); font-size: var(--text-sm);">Searching YouTube…</p>
        </div>
        <div id="youtube-search-results" class="track-list" style="display: none; margin-top: var(--space-3);"></div>
    </div>

    <!-- Paste URL -->
    <div class="card" style="padding: var(--space-2);">
        <form id="download-form" onsubmit="return false" style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
            <input type="url" name="url" class="input" placeholder="https://youtube.com/... or https://.../audio.mp3"
                   style="flex: 1; min-width: 200px;" required>
            <select name="container" class="input" title="Container">
                <option value="auto">Auto (best playable)</option>
                <option value="mp4">M4A / AAC</option>
                <option value="webm">WEBM / Opus</option>
            </select>
            <select name="quality" class="input" title="Quality">
                <option value="best">Best</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button type="submit" class="btn btn-primary">
                <i data-lucide="download"></i>
                Start Download
            </button>
        </form>
    </div>

    <!-- Playlist Preview Card (Batch Download UI) -->
    <div id="youtube-playlist-preview" class="playlist-preview-card" style="display: none;"></div>

    <div class="section-header" style="margin-top: var(--space-6);">
        <h2 class="section-title">Active Downloads</h2>
    </div>

    <div id="downloads-list" class="track-list">
        <div class="empty-state">
            <div class="empty-state-icon">
                <i data-lucide="download"></i>
            </div>
            <h2 class="empty-state-title">No active downloads</h2>
            <p class="empty-state-description">Add a URL above to start downloading.</p>
        </div>
    </div>
</section>
