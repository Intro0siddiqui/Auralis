<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070b10">
    <title>Auralis v2</title>
    
    <!-- Design Tokens -->
    <link rel="stylesheet" href="styles/tokens.css">
    
    <!-- App Styles -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/responsive.css">
    
    <!-- HTMX for dynamic content -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar Navigation - loaded via HTMX -->
        <aside id="sidebar" class="glass sidebar" 
              hx-get="/partials/nav" 
              hx-trigger="load" 
              hx-target="this">
        </aside>
        
        <!-- Main Content Area - loaded via HTMX -->
        <main id="content" class="content" 
              hx-get="/partials/home" 
              hx-trigger="load" 
              hx-swap="innerHTML">
        </main>
        
        <!-- Queue Panel - hidden by default -->
        <aside id="queue-panel" class="glass queue-panel"></aside>
        
        <!-- Player Bar - static, not HTMX swapped -->
        <footer id="player-bar" class="neu-glass player-bar">
            <div class="player-track">
                <div class="track-artwork" id="current-artwork">
                    <div class="artwork-placeholder">
                        <i data-lucide="disc"></i>
                    </div>
                </div>
                <div class="track-info">
                    <div class="track-title" id="track-title">No track playing</div>
                    <div class="track-artist" id="track-artist">Select a song</div>
                </div>
                <button class="track-like" id="track-like" aria-label="Like">
                    <i data-lucide="heart"></i>
                </button>
            </div>
            
            <div class="player-controls">
                <div class="control-buttons">
                    <button class="control-btn" id="shuffle-btn" aria-label="Shuffle">
                        <i data-lucide="shuffle"></i>
                    </button>
                    <button class="control-btn" id="prev-btn" aria-label="Previous">
                        <i data-lucide="skip-back"></i>
                    </button>
                    <button class="control-btn play-btn" id="play-pause-btn" aria-label="Play">
                        <i data-lucide="play"></i>
                    </button>
                    <button class="control-btn" id="next-btn" aria-label="Next">
                        <i data-lucide="skip-forward"></i>
                    </button>
                    <button class="control-btn" id="repeat-btn" aria-label="Repeat">
                        <i data-lucide="repeat"></i>
                    </button>
                </div>
                <div class="progress-container">
                    <span class="time-current" id="time-current">0:00</span>
                    <div class="progress-track neu-inset" id="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                        <div class="progress-handle neu" id="progress-handle"></div>
                    </div>
                    <span class="time-total" id="time-total">0:00</span>
                </div>
            </div>
            
            <div class="player-extra">
                <button class="extra-btn" id="queue-btn" aria-label="Queue">
                    <i data-lucide="list"></i>
                </button>
                <button class="extra-btn" id="devices-btn" aria-label="Devices">
                    <i data-lucide="speakers"></i>
                </button>
                <button class="extra-btn" id="volume-btn" aria-label="Volume">
                    <i data-lucide="volume-2"></i>
                </button>
                <div class="volume-slider neu-inset" id="volume-slider">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </footer>
        
        <!-- Mobile Navigation -->
        <nav id="mobile-nav" class="neu-glass mobile-nav">
            <a href="#" class="mobile-nav-item" 
               hx-get="/partials/home" 
               hx-target="#content" 
               hx-swap="innerHTML">
                <i data-lucide="home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="mobile-nav-item" 
               hx-get="/partials/library" 
               hx-target="#content" 
               hx-swap="innerHTML">
                <i data-lucide="library"></i>
                <span>Library</span>
            </a>
            <a href="#" class="mobile-nav-item" 
               hx-get="/partials/search" 
               hx-target="#content" 
               hx-swap="innerHTML">
                <i data-lucide="search"></i>
                <span>Search</span>
            </a>
            <a href="#" class="mobile-nav-item" 
               hx-get="/partials/settings" 
               hx-target="#content" 
               hx-swap="innerHTML">
                <i data-lucide="settings"></i>
                <span>More</span>
            </a>
        </nav>
    </div>
    
    <!-- Overlay Root for Full-Screen Player -->
    <div id="overlay-root"></div>
    
    <!-- App Scripts -->
    <script src="js/bridge.js"></script>
    <script src="js/player.js"></script>
    
    <!-- Initialize Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
        
        // Re-init icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
