# Link the Android C++ runtime so libauralis_lib.so records libc++_shared.so
# as a DT_NEEDED dependency. cpal's Android backend (Oboe/AAudio) is C++ and
# references __cxa_pure_virtual, __cxa_throw, std::* vtables, etc. Without this,
# the Android linker cannot resolve those symbols at app startup and the app
# crashes with UnsatisfiedLinkError on loadLibrary.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-lc++_shared", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-lc++_shared"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-lc++_shared"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-lc++_shared", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-L/home/intro/.local/opt/gtk3/usr/lib",
    "-C", "link-arg=-L/home/intro/.local/opt/sysroot/usr/lib",
    "-C", "link-arg=-Wl,-rpath,/home/intro/.local/opt/gtk3/usr/lib",
    "-C", "link-arg=-Wl,-rpath,/home/intro/.local/opt/sysroot/usr/lib",
]

[env]
PKG_CONFIG_PATH = "/home/intro/.local/opt/gtk3/usr/lib/pkgconfig:/home/intro/.local/opt/sysroot/usr/lib/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"
