<section class="page-downloads">
    <header class="page-header">
        <h1>Downloads</h1>
    </header>

    <form class="download-form"
          hx-post="/api/downloads/audio"
          hx-trigger="submit"
          hx-target="#download-list"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset(); window.Auralis.toast('Download queued','success')">
        <input type="url" name="url" placeholder="Paste a YouTube or Instagram URL…" required />
        <select name="format">
            <option value="mp3">MP3</option>
            <option value="flac">FLAC</option>
            <option value="m4a">M4A</option>
            <option value="ogg">OGG</option>
        </select>
        <button class="btn primary" type="submit">Download</button>
    </form>

    <div id="download-list" class="download-list"
         hx-get="/api/downloads/render"
         hx-trigger="load, every 2s"
         hx-swap="innerHTML">
        {% for download in downloads %}
            {% include "partials/download_item.html" %}
        {% endfor %}
    </div>
</section>
