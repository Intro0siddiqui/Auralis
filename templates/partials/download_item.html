<div class="download-item status-{{ download.status }}" data-download-id="{{ download.id }}">
    <div class="info">
        <strong>{{ download.title }}</strong>
        <span class="muted">{{ download.platform }} · {{ download.format }}</span>
    </div>
    <div class="progress">
        <progress max="1" value="{{ download.progress }}"></progress>
        <span class="muted">{{ download.formatted_size() }} · {{ download.formatted_speed() }} · ETA {{ download.formatted_eta() }}</span>
    </div>
    <div class="actions">
        {% if download.status == "downloading" %}
        <button hx-post="/api/downloads/pause/{{ download.id }}" hx-swap="none">Pause</button>
        {% else if download.status == "paused" %}
        <button hx-post="/api/downloads/resume/{{ download.id }}" hx-swap="none">Resume</button>
        {% endif %}
        <button class="danger" hx-post="/api/downloads/cancel/{{ download.id }}" hx-swap="none"
                hx-on::after-request="this.closest('.download-item').remove()">
            Cancel
        </button>
    </div>
</div>
