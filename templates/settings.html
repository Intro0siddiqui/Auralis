<section class="page-settings">
    <header class="page-header">
        <h1>Settings</h1>
    </header>

    <form class="settings-form"
          hx-post="/api/settings/update"
          hx-trigger="change"
          hx-swap="none">

        <fieldset>
            <legend>Audio</legend>
            <label>Volume
                <input type="range" name="audio.volume"
                       min="0" max="1" step="0.01"
                       value="{{ settings.audio.volume }}" />
            </label>
            <label class="checkbox">
                <input type="checkbox" name="audio.gapless_playback"
                       {% if settings.audio.gapless_playback %}checked{% endif %} />
                Gapless playback
            </label>
            <label class="checkbox">
                <input type="checkbox" name="audio.normalize_audio"
                       {% if settings.audio.normalize_audio %}checked{% endif %} />
                Normalize audio (replaygain)
            </label>
        </fieldset>

        <fieldset>
            <legend>Downloads</legend>
            <label>Download path
                <input type="text" name="downloads.download_path"
                       value="{{ settings.downloads.download_path.display() }}" />
            </label>
            <label>Default format
                <select name="downloads.default_format">
                    <option value="mp3"  {% if settings.downloads.default_format == "mp3"  %}selected{% endif %}>MP3</option>
                    <option value="flac" {% if settings.downloads.default_format == "flac" %}selected{% endif %}>FLAC</option>
                    <option value="m4a"  {% if settings.downloads.default_format == "m4a"  %}selected{% endif %}>M4A</option>
                    <option value="ogg"  {% if settings.downloads.default_format == "ogg"  %}selected{% endif %}>OGG</option>
                </select>
            </label>
            <label>Quality (kbps)
                <input type="number" name="downloads.default_quality"
                       value="{{ settings.downloads.default_quality }}" min="64" max="1411" />
            </label>
            <label class="checkbox">
                <input type="checkbox" name="downloads.embed_artwork"
                       {% if settings.downloads.embed_artwork %}checked{% endif %} />
                Embed artwork
            </label>
        </fieldset>

        <fieldset>
            <legend>Appearance</legend>
            <label>Theme
                <select name="appearance.theme">
                    <option value="dark"   {% if settings.appearance.theme == "dark"   %}selected{% endif %}>Dark</option>
                    <option value="light"  {% if settings.appearance.theme == "light"  %}selected{% endif %}>Light</option>
                    <option value="system" {% if settings.appearance.theme == "system" %}selected{% endif %}>System</option>
                </select>
            </label>
            <label>Accent color
                <input type="color" name="appearance.accent_color"
                       value="#{{ settings.appearance.accent_color }}" />
            </label>
        </fieldset>

        <fieldset>
            <legend>Sync</legend>
            <label class="checkbox">
                <input type="checkbox" name="sync.enabled"
                       {% if settings.sync.enabled %}checked{% endif %} />
                Enable P2P sync
            </label>
            <label class="checkbox">
                <input type="checkbox" name="sync.wifi_only"
                       {% if settings.sync.wifi_only %}checked{% endif %} />
                Sync over WiFi only
            </label>
        </fieldset>
    </form>
</section>
