<section class="page-playlists">
    <header class="page-header">
        <h1>Playlists</h1>
        <button class="btn primary"
                hx-post="/api/playlists/create"
                hx-vals='{"name":"New Playlist"}'
                hx-trigger="click"
                hx-target="#playlist-list"
                hx-swap="afterbegin">
            New Playlist
        </button>
    </header>

    <div id="playlist-list" class="playlist-grid">
        {% for playlist in playlists %}
        <a class="playlist-card" href="/playlist.html?id={{ playlist.id }}">
            <div class="art">
                <div class="art-placeholder">♪</div>
            </div>
            <div class="meta">
                <h3>{{ playlist.name }}</h3>
                <p class="muted">{{ playlist.track_count() }} tracks</p>
            </div>
        </a>
        {% endfor %}
    </div>
</section>
