<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <title>{{ title }} — Auralis</title>

    <!-- HTMX 2.0.3 -->
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <!-- SSE extension (used for download progress + now-playing updates) -->
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>

    <!-- App styles -->
    <link rel="stylesheet" href="/css/auralis.css" />
    <link rel="icon" type="image/svg+xml" href="/icons/auralis.svg" />
</head>
<body hx-boost="true" hx-target="#main" hx-swap="innerHTML" hx-indicator="#topbar-progress">

    <!-- Top bar -->
    <header class="topbar">
        <a class="brand" href="/index.html">
            <img src="/icons/auralis.svg" alt="" width="28" height="28" />
            <span>Auralis</span>
        </a>

        <div class="search">
            <input
                type="search"
                name="q"
                placeholder="Search tracks, artists, albums…"
                hx-get="/api/library/search"
                hx-trigger="input changed delay:250ms, keyup[key=='Enter']"
                hx-target="#main"
                hx-swap="innerHTML"
                autocomplete="off"
            />
        </div>

        <nav class="topnav">
            <a href="/index.html"           hx-get="/api/templates/library"   hx-push-url="true">Library</a>
            <a href="/albums.html"          hx-get="/api/templates/albums"    hx-push-url="true">Albums</a>
            <a href="/artists.html"         hx-get="/api/templates/artists"   hx-push-url="true">Artists</a>
            <a href="/downloads.html"       hx-get="/api/templates/downloads" hx-push-url="true">Downloads</a>
            <a href="/playlists.html"       hx-get="/api/templates/playlists" hx-push-url="true">Playlists</a>
            <a href="/sync.html"            hx-get="/api/templates/sync"      hx-push-url="true">Sync</a>
        </nav>

        <div class="top-actions">
            <a class="icon-btn" href="/settings.html" hx-get="/api/templates/settings" hx-push-url="true" title="Settings">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
        </div>

        <div id="topbar-progress" class="htmx-indicator" aria-hidden="true">
            <div class="bar"></div>
        </div>
    </header>

    <!-- Sidebar (visible on desktop, drawer on mobile) -->
    <aside class="sidebar" aria-label="Primary navigation">
        <ul>
            <li><a href="/index.html"      hx-get="/api/templates/library"   hx-push-url="true" class="{% if active_page == "library" %}active{% endif %}">Library</a></li>
            <li><a href="/albums.html"     hx-get="/api/templates/albums"    hx-push-url="true" class="{% if active_page == "albums" %}active{% endif %}">Albums</a></li>
            <li><a href="/artists.html"    hx-get="/api/templates/artists"   hx-push-url="true" class="{% if active_page == "artists" %}active{% endif %}">Artists</a></li>
            <li><a href="/downloads.html"  hx-get="/api/templates/downloads" hx-push-url="true" class="{% if active_page == "downloads" %}active{% endif %}">Downloads</a></li>
            <li><a href="/playlists.html"  hx-get="/api/templates/playlists" hx-push-url="true" class="{% if active_page == "playlists" %}active{% endif %}">Playlists</a></li>
            <li><a href="/sync.html"       hx-get="/api/templates/sync"      hx-push-url="true" class="{% if active_page == "sync" %}active{% endif %}">Devices</a></li>
        </ul>
    </aside>

    <!-- Main content (HTMX target) -->
    <main id="main" class="main">
        {{ content|safe }}
    </main>

    <!-- Persistent now-playing bar -->
    <footer id="now-playing-bar"
            hx-get="/api/playback/render_now_playing"
            hx-trigger="every 1s"
            hx-swap="innerHTML">
        {% include "partials/now_playing.html" %}
    </footer>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="/js/auralis.js" defer></script>
</body>
</html>
